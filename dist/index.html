<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign-out</title>
  <meta name="description" content="Schema-driven pathology sign-out: small biopsy and synoptic reporting." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#case">Skip to case</a>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-label="Sign-out" role="img" fill="none">
        <rect x="3" y="3" width="26" height="26" rx="3" stroke="currentColor" stroke-width="2" />
        <path d="M9 16.5l4 4 10-10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>Sign-out</h1>
    </div>
    <nav class="templates" aria-label="Template" id="template-nav"></nav>
    <div class="topbar-actions">
      <button class="btn ghost" id="btn-example" type="button">Load example</button>
      <button class="btn ghost" id="btn-new" type="button">New case</button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="workspace">
    <section class="case" id="case" aria-labelledby="case-heading">
      <h2 id="case-heading" class="sr-only">Case</h2>
      <div id="case-fields" class="case-fields"></div>
      <div class="parts-bar">
        <div class="tabs" id="part-tabs" role="tablist" aria-label="Parts"></div>
        <button class="btn ghost small" id="btn-add-part" type="button">+ Part</button>
      </div>
      <div id="part-panel" class="part-panel" role="tabpanel"></div>
      <div id="case-options" class="case-options"></div>
    </section>

    <section class="report" aria-labelledby="report-heading">
      <div class="report-head">
        <h2 id="report-heading">Report</h2>
        <div class="report-actions">
          <button class="btn primary" id="btn-copy-dx" type="button" title="Cmd/Ctrl + Shift + C">Copy diagnosis</button>
          <button class="btn" id="btn-copy-report" type="button" title="Cmd/Ctrl + Enter">Copy full report</button>
        </div>
      </div>
      <div id="report-blocks" class="report-blocks"></div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status-template"></span>
    <span class="hint">Number keys pick options in the focused field. Cmd/Ctrl+Shift+C copies the diagnosis, Cmd/Ctrl+Enter the full report.</span>
    <span id="status-save">Not saved. Drive storage arrives in Phase 2.</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
