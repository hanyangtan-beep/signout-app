<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gastric Biopsy Signout</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --space-2:.5rem; --space-3:.75rem; --space-4:1rem; --space-5:1.25rem; --space-6:1.5rem;
      --radius-md:.5rem; --radius-lg:.75rem; --radius-xl:1rem; --radius-full:9999px;
      --color-bg:#f7f6f2; --color-surface:#faf9f6; --color-surface-2:#fff; --color-surface-offset:#f0ede8; --color-border:#d6d1c8;
      --color-text:#25231d; --color-text-muted:#66645f; --color-text-inverse:#f9f8f4; --color-primary:#0d6b63; --color-primary-hover:#0b5953; --color-primary-highlight:#d7e5e2;
      --shadow-sm:0 1px 2px rgba(18,18,18,.06); --shadow-lg:0 18px 48px rgba(18,18,18,.12); --font-body:'Satoshi', Inter, sans-serif;
    }
    [data-theme="dark"] {
      --color-bg:#151412; --color-surface:#1b1a18; --color-surface-2:#23211f; --color-surface-offset:#262421; --color-border:#3c3933;
      --color-text:#e0ddd8; --color-text-muted:#b0aca5; --color-text-inverse:#171614; --color-primary:#5ba79f; --color-primary-hover:#78b9b2; --color-primary-highlight:#263432;
      --shadow-sm:0 1px 2px rgba(0,0,0,.24); --shadow-lg:0 18px 48px rgba(0,0,0,.40);
    }
    *{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.5;color:var(--color-text);background:var(--color-bg)}
    button,input,select,textarea{font:inherit}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .app{min-height:100dvh;display:grid;grid-template-columns:320px 1fr}.sidebar{background:var(--color-surface);border-right:1px solid var(--color-border);padding:var(--space-6);position:sticky;top:0;height:100dvh;overflow:auto}.main{display:flex;flex-direction:column;min-width:0}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--color-border);background:color-mix(in srgb,var(--color-surface) 92%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
    .brand{display:flex;align-items:center;gap:var(--space-3)} .logo{width:34px;height:34px;border-radius:10px;background:var(--color-primary-highlight);color:var(--color-primary);display:grid;place-items:center;flex:0 0 auto}.brand h1{font-size:var(--text-lg);line-height:1.1;margin:0}
    .tiny{font-size:var(--text-xs);color:var(--color-text-muted)} .muted{color:var(--color-text-muted)} .content{padding:var(--space-6);display:grid;grid-template-columns:1.08fr .92fr;gap:var(--space-6);align-items:start}
    .card{background:var(--color-surface-2);border:1px solid color-mix(in srgb,var(--color-text) 10%,transparent);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm)} .card-header{padding:var(--space-5) var(--space-5) 0}.card-body{padding:var(--space-5)}
    .stack{display:grid;gap:var(--space-4)} .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)} .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
    label{display:block;font-size:var(--text-sm);font-weight:600;margin-bottom:var(--space-2)} input[type="text"],select,textarea{width:100%;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);border-radius:var(--radius-md);padding:.78rem .9rem;outline:none} textarea{min-height:88px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-primary) 18%,transparent)} .btn-row{display:flex;flex-wrap:wrap;gap:var(--space-3)}
    .btn{border:none;border-radius:var(--radius-md);padding:.8rem 1rem;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-size:var(--text-sm);font-weight:700}.btn-primary{background:var(--color-primary);color:var(--color-text-inverse)}.btn-primary:hover{background:var(--color-primary-hover)}.btn-secondary{background:var(--color-surface-offset);color:var(--color-text);border:1px solid var(--color-border)}.btn-ghost{background:transparent;color:var(--color-text-muted);border:1px dashed var(--color-border)}
    .specimen-tabs{display:flex;flex-wrap:wrap;gap:var(--space-2)} .tab-btn{min-width:44px;min-height:44px;padding:.6rem .9rem;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text-muted);font-weight:700}.tab-btn.active{background:var(--color-primary);color:var(--color-text-inverse);border-color:var(--color-primary)}
    .specimen-panel{display:none}.specimen-panel.active{display:block}.badge{display:inline-flex;align-items:center;gap:.35rem;padding:.38rem .65rem;border-radius:var(--radius-full);background:var(--color-primary-highlight);color:var(--color-primary);font-size:var(--text-xs);font-weight:700}
    .output-box{white-space:pre-wrap;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.93rem}.section-title{font-size:var(--text-lg);margin:0 0 var(--space-2)} .kpi{padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-surface-offset);border:1px solid var(--color-border)} .kpi strong{display:block;font-size:var(--text-lg)} .mobile-toggle{display:none}
    @media (max-width:1100px){.content{grid-template-columns:1fr}} @media (max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:min(90vw,340px);transform:translateX(-100%);transition:transform 180ms ease;z-index:30;box-shadow:var(--shadow-lg)}.sidebar.open{transform:translateX(0)}.mobile-toggle{display:inline-flex}.content,.topbar{padding-inline:var(--space-4)}.grid-2,.grid-3{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <a href="#main" class="sr-only">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="stack">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h7a5 5 0 0 1 0 10H9v4"/><path d="M9 19c0-2.5 2.2-4 4.7-4"/></svg>
          </div>
          <div><h1>Gastric Biopsy</h1><div class="tiny">Structured sign-out helper</div></div>
        </div>
        <div class="card">
          <div class="card-header"><h2 class="section-title">Case setup</h2></div>
          <div class="card-body stack">
            <div><label for="caseTitle">Specimen(s)</label><input id="caseTitle" type="text" value="(A) Antrum and (B) Body"></div>
            <div><label for="specimenCount">Number of parts</label><select id="specimenCount"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></div>
            <div class="btn-row"><button class="btn btn-primary" id="loadExampleBtn">Load example</button><button class="btn btn-secondary" id="copyDiagnosisBtn">Copy diagnosis</button><button class="btn btn-ghost" id="clearBtn">Clear</button></div>
          </div>
        </div>
      </div>
    </aside>
    <main class="main" id="main">
      <header class="topbar">
        <div class="brand">
          <button class="btn btn-secondary mobile-toggle" id="menuBtn" aria-label="Open menu">☰</button>
          <div><div class="badge">Gastric biopsy drafting app</div><div class="tiny">Container-based microscopy and diagnosis output.</div></div>
        </div>
        <div class="btn-row"><button class="btn btn-secondary" id="themeBtn" aria-label="Switch theme">◐</button><button class="btn btn-primary" id="generateBtn">Generate report</button></div>
      </header>
      <section class="content">
        <div class="stack">
          <div class="card">
            <div class="card-header"><h2 class="section-title">Specimen input</h2><p class="muted">Complete each biopsy part, then generate the report text.</p></div>
            <div class="card-body stack"><div class="specimen-tabs" id="specimenTabs"></div><div id="specimenPanels"></div></div>
          </div>
        </div>
        <div class="stack">
          <div class="grid-2"><div class="kpi"><span class="tiny">Visible parts</span><strong id="visibleCount">2</strong></div><div class="kpi"><span class="tiny">Diagnosis lines</span><strong id="lineCount">0</strong></div></div>
          <div class="card">
            <div class="card-header"><h2 class="section-title">Generated sign-out</h2></div>
            <div class="card-body stack">
              <div><label>Specimen(s)</label><div class="output-box" id="specimensOutput"></div></div>
              <div><label>Microscopic examination</label><div class="output-box" id="findingsOutput"></div></div>
              <div><label>Diagnosis</label><div class="output-box" id="diagnosisOutput"></div></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const parts = [
      { label:'A', specimenName:'Antrum', siteType:'Pyloric type', activity:'Absent', chronic:'Mild', follicles:'Absent', atrophy:'Absent', ulcer:'Absent', imDegree:'Absent', imType:'', dysplasia:'Absent', hp:'Absent', additionalNotes:'' },
      { label:'B', specimenName:'Body', siteType:'Body type', activity:'Mild', chronic:'Mild', follicles:'Present', atrophy:'Absent', ulcer:'Present', imDegree:'Mild', imType:'Incomplete', dysplasia:'Absent', hp:'Moderate density', additionalNotes:'' },
      { label:'C', specimenName:'', siteType:'Pyloric type', activity:'Absent', chronic:'Absent', follicles:'Absent', atrophy:'Absent', ulcer:'Absent', imDegree:'Absent', imType:'', dysplasia:'Absent', hp:'Absent', additionalNotes:'' },
      { label:'D', specimenName:'', siteType:'Body type', activity:'Absent', chronic:'Absent', follicles:'Absent', atrophy:'Absent', ulcer:'Absent', imDegree:'Absent', imType:'', dysplasia:'Absent', hp:'Absent', additionalNotes:'' }
    ];
    const specimenCountEl = document.getElementById('specimenCount');
    const caseTitleEl = document.getElementById('caseTitle');
    const specimenTabs = document.getElementById('specimenTabs');
    const specimenPanels = document.getElementById('specimenPanels');
    const visibleCountEl = document.getElementById('visibleCount');
    const lineCountEl = document.getElementById('lineCount');
    const specimensOutput = document.getElementById('specimensOutput');
    const findingsOutput = document.getElementById('findingsOutput');
    const diagnosisOutput = document.getElementById('diagnosisOutput');
    const sidebar = document.getElementById('sidebar');
    let activeIndex = 0;

    function esc(v){return String(v ?? '').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    function options(list, selected){return list.map(item => `<option value="${esc(item)}" ${item===selected?'selected':''}>${item}</option>`).join('');}
    function low(v){return String(v || '').trim().toLowerCase();}
    function present(v){return v && v !== 'Absent';}
    function hpPresent(v){return v !== 'Absent';}

    function renderSpecimens(){
      const count = Number(specimenCountEl.value);
      visibleCountEl.textContent = String(count);
      specimenTabs.innerHTML = '';
      specimenPanels.innerHTML = '';
      for(let i=0;i<count;i++){
        const s = parts[i];
        const tab = document.createElement('button');
        tab.type='button';
        tab.className='tab-btn'+(i===activeIndex?' active':'');
        tab.textContent=s.label;
        tab.addEventListener('click',()=>{activeIndex=i; renderSpecimens();});
        specimenTabs.appendChild(tab);
        const panel = document.createElement('section');
        panel.className='specimen-panel card '+(i===activeIndex?'active':'');
        panel.innerHTML = `
          <div class="card-body stack">
            <div class="grid-2">
              <div><label>Part ${s.label} specimen name</label><input type="text" data-index="${i}" data-field="specimenName" value="${esc(s.specimenName)}" placeholder="e.g. Antrum"></div>
              <div><label>Site</label><select data-index="${i}" data-field="siteType">${options(['Pyloric type','Body type','Cardiac type','Superficial gastric mucosa','Indeterminate'], s.siteType)}</select></div>
            </div>
            <div class="grid-3">
              <div><label>Activity</label><select data-index="${i}" data-field="activity">${options(['Absent','Mild','Moderate','Marked'], s.activity)}</select></div>
              <div><label>Chronic inflammation</label><select data-index="${i}" data-field="chronic">${options(['Absent','Mild','Moderate','Marked'], s.chronic)}</select></div>
              <div><label>Reactive lymphoid follicle(s)</label><select data-index="${i}" data-field="follicles">${options(['Absent','Present'], s.follicles)}</select></div>
              <div><label>Atrophy</label><select data-index="${i}" data-field="atrophy">${options(['Absent','Mild','Moderate','Marked'], s.atrophy)}</select></div>
              <div><label>Evidence of ulcer / erosion</label><select data-index="${i}" data-field="ulcer">${options(['Absent','Present'], s.ulcer)}</select></div>
              <div><label>Intestinal metaplasia degree</label><select data-index="${i}" data-field="imDegree">${options(['Absent','Mild','Moderate','Marked'], s.imDegree)}</select></div>
              <div><label>Intestinal metaplasia type</label><select data-index="${i}" data-field="imType"><option value="" ${s.imType===''?'selected':''}></option>${options(['Complete','Incomplete'], s.imType)}</select></div>
              <div><label>Dysplasia / malignancy</label><select data-index="${i}" data-field="dysplasia">${options(['Absent','Indefinite for dysplasia','Low grade dysplasia','High grade dysplasia','Intramucosal carcinoma','Malignancy present'], s.dysplasia)}</select></div>
              <div><label>Helicobacter pylori</label><select data-index="${i}" data-field="hp">${options(['Absent','Low density','Moderate density','High density'], s.hp)}</select></div>
            </div>
            <div>
              <label>Additional notes</label>
              <textarea data-index="${i}" data-field="additionalNotes" placeholder="Freeform microscopic notes">${esc(s.additionalNotes || '')}</textarea>
            </div>
          </div>`;
        specimenPanels.appendChild(panel);
      }
      specimenPanels.querySelectorAll('input, select, textarea').forEach(el => {
        el.addEventListener('input', handleFieldChange);
        el.addEventListener('change', handleFieldChange);
      });
    }

    function handleFieldChange(e){
      const i = Number(e.target.dataset.index);
      const field = e.target.dataset.field;
      parts[i][field] = e.target.value;
      if (field === 'imDegree' && e.target.value === 'Absent') parts[i].imType = '';
      generate();
    }

    function buildMicroscopy(s){
      const imText = s.imDegree === 'Absent' ? 'Absent' : (s.imType ? `${s.imDegree} (${low(s.imType)})` : s.imDegree);
      const note = (s.additionalNotes || '').trim();
      const lines = [
        `(${s.label})`,
        `- Site: ${s.siteType}`,
        `- Activity: ${s.activity}`,
        `- Chronic inflammation: ${s.chronic}`,
        `- Reactive lymphoid follicle(s): ${s.follicles}`,
        `- Atrophy: ${s.atrophy}`,
        `- Evidence of ulcer / erosion: ${s.ulcer}`,
        `- Intestinal metaplasia: ${imText}`,
        `- Dysplasia / malignancy: ${s.dysplasia}`,
        `- Helicobacter pylori: ${s.hp}`
      ];
      if (note !== '') lines.push(`- Additional notes: ${note}`);
      return lines.join('\n');
    }


    function parseSitesFromSpecimens(text){
      const out = {};
      const re = /\(([A-D])\)\s*([^\(]+)/gi;
      let m;
      while ((m = re.exec(text || '')) !== null) {
        let site = (m[2] || '').trim();
        site = site.replace(/\s+(and|&)\s*$/i, '').trim();
        site = site.replace(/[;,]+$/g, '').trim();
        if (site) out[m[1].toUpperCase()] = site;
      }
      return out;
    }

    function buildDiagnosis(s, parsedSites){
      const verbatimSite = (parsedSites && parsedSites[s.label]) ? parsedSites[s.label] : (s.specimenName || 'stomach');
      const site = low(verbatimSite);
      let line = `(${s.label}) STOMACH, ${site}, biopsy - `;
      if (hpPresent(s.hp)) {
        line += 'HELICOBACTER ASSOCIATED CHRONIC ' + (present(s.activity) ? 'ACTIVE ' : '') + 'GASTRITIS';
      } else if (present(s.activity)) {
        line += 'CHRONIC ACTIVE GASTRITIS';
      } else {
        line += 'CHRONIC GASTRITIS, inactive, Helicobacter-negative';
      }
      const extras = [];
      if (s.ulcer === 'Present') extras.push('with ULCER');
      if (present(s.imDegree)) {
        const suffix = s.imType ? ` (${low(s.imType)})` : '';
        extras.push(`${low(s.imDegree)} INTESTINAL METAPLASIA${suffix}`);
      }
      if (present(s.atrophy)) extras.push(`${low(s.atrophy)} ATROPHY`);
      if (s.dysplasia !== 'Absent') extras.push(s.dysplasia.toUpperCase());
      if (hpPresent(s.hp) && extras.length) {
        line += ' ' + extras[0];
        if (extras.length > 1) line += '; ' + extras.slice(1).join('; ');
      } else if (!hpPresent(s.hp) && extras.length) {
        line += '; ' + extras.join('; ');
      }
      return line;
    }

    function generate(){
      const count = Number(specimenCountEl.value);
      const items = parts.slice(0, count);
      const parsedSites = parseSitesFromSpecimens(caseTitleEl.value);
      specimensOutput.textContent = caseTitleEl.value.trim() || items.map(s => `(${s.label}) ${s.specimenName || ('Part ' + s.label)}`).join(' and ');
      findingsOutput.textContent = items.map(buildMicroscopy).join('\n\n');
      diagnosisOutput.textContent = items.map(s => buildDiagnosis(s, parsedSites)).join('\n');
      lineCountEl.textContent = String(items.length);
    }

    function loadExample(){
      caseTitleEl.value = '(A) Antrum and (B) Body';
      specimenCountEl.value = '2';
      parts[0] = { label:'A', specimenName:'Antrum', siteType:'Pyloric type', activity:'Absent', chronic:'Mild', follicles:'Absent', atrophy:'Absent', ulcer:'Absent', imDegree:'Absent', imType:'', dysplasia:'Absent', hp:'Absent', additionalNotes:'' };
      parts[1] = { label:'B', specimenName:'Body', siteType:'Body type', activity:'Mild', chronic:'Mild', follicles:'Present', atrophy:'Absent', ulcer:'Present', imDegree:'Mild', imType:'Incomplete', dysplasia:'Absent', hp:'Moderate density', additionalNotes:'' };
      parts[2] = { label:'C', specimenName:'', siteType:'Pyloric type', activity:'Absent', chronic:'Absent', follicles:'Absent', atrophy:'Absent', ulcer:'Absent', imDegree:'Absent', imType:'', dysplasia:'Absent', hp:'Absent', additionalNotes:'' };
      parts[3] = { label:'D', specimenName:'', siteType:'Body type', activity:'Absent', chronic:'Absent', follicles:'Absent', atrophy:'Absent', ulcer:'Absent', imDegree:'Absent', imType:'', dysplasia:'Absent', hp:'Absent', additionalNotes:'' };
      activeIndex = 0;
      renderSpecimens();
      generate();
    }

    function clearVisible(){
      const count = Number(specimenCountEl.value);
      for(let i=0;i<count;i++){
        const label = parts[i].label;
        parts[i] = { label, specimenName:'', siteType:i===0?'Pyloric type':'Body type', activity:'Absent', chronic:'Absent', follicles:'Absent', atrophy:'Absent', ulcer:'Absent', imDegree:'Absent', imType:'', dysplasia:'Absent', hp:'Absent', additionalNotes:'' };
      }
      caseTitleEl.value='';
      activeIndex=0;
      renderSpecimens();
      generate();
    }

    async function copyDiagnosis(){ try { await navigator.clipboard.writeText(diagnosisOutput.textContent || ''); } catch(e){} }
    document.getElementById('generateBtn').addEventListener('click', generate);
    document.getElementById('loadExampleBtn').addEventListener('click', loadExample);
    document.getElementById('copyDiagnosisBtn').addEventListener('click', copyDiagnosis);
    document.getElementById('clearBtn').addEventListener('click', clearVisible);
    specimenCountEl.addEventListener('change', ()=>{activeIndex=0; renderSpecimens(); generate();});
    caseTitleEl.addEventListener('input', generate);
    document.getElementById('menuBtn').addEventListener('click', ()=>sidebar.classList.toggle('open'));
    (function(){const btn=document.getElementById('themeBtn'),root=document.documentElement;let mode=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';root.setAttribute('data-theme',mode);btn.addEventListener('click',()=>{mode=mode==='dark'?'light':'dark';root.setAttribute('data-theme',mode);});})();
    renderSpecimens();
    generate();
  </script>
</body>
</html>
